<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="login-screen" class="login-screen">
        <div class="login-card"><h1>Welcome to My Docs</h1>
        <p>Sign in to create documents and access documents shared with you.</p>
        <div id="google-signin"></div><p id="login-message" role="status">Loading sign-in…</p></div>
    </section>
    <div id="workspace" hidden>


    <!-- Top-->
    <header class="topbar">
        <div class="logo">📄</div>

        <div class="document-info">
            <input type="text" id="document-title" value="Untitled document" title="Document Name">
            <p>My Docs</p>
        </div>

        <div class="top-actions">
            <span id="save-status">All changes saved</span>
            <span id="access-role"></span>
            <span id="account-name"></span><button id="logout-btn">Log out</button>
            <button id="share-btn">Share</button>
        </div>
    </header>

    <!--Toolbar -->
    <nav class="toolbar">
        <button id="undo-btn" title="Undo">↶</button>
        <button id="redo-btn" title="Redo">↷</button>

        <span class="separator"></span>

        <select id="block-format" title="Text style">
            <option value="p">Normal text</option>
            <option value="h1">Heading 1</option>
            <option value="h2">Heading 2</option>
            <option value="h3">Heading 3</option>
        </select>
        <span class="separator"></span>
        <select id="font-family" title="Font family">
            <option value="Arial">Arial</option>
            <option value="Georgia">Georgia</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Verdana">Verdana</option>
            <option value="Courier New">Courier New</option>
        </select>

        <span class="separator"></span>

        <select id="font-size" title="Font size">
            <option value="2">10</option>
            <option value="3" selected>12</option>
            <option value="4">14</option>
            <option value="5">18</option>
            <option value="6">24</option>
            <option value="7">36</option>
        </select>


        <span class="separator"></span>

        <button data-command="bold" title="Bold"><b>B</b></button>
        <button data-command="italic" title="Italic"><i>I</i></button>
        <button data-command="underline" title="Underline"><u>U</u></button>

        <span class="separator"></span>

        <button data-command="insertUnorderedList" title="Bulleted list">• List</button>
        <button data-command="insertOrderedList" title="Numbered list">1. List</button>

        <span class="separator"></span>
        
        <div class="color-control">
    <button
        type="button"
        id="text-color-btn"
        class="color-btn"
        title="Text colour"
    >
        <span class="color-letter">A</span>
        <span id="text-color-indicator" class="color-indicator"></span>
        <span class="dropdown-arrow">▾</span>
    </button>

    <input
        type="color"
        id="text-color"
        value="#000000"
        class="hidden-color-input"
    >
        </div>
<div class="color-control">
    <button
        type="button"
        id="highlight-btn"
        class="color-btn"
        title="Highlight text"
        aria-pressed="false"
    >
        <span>🖍</span>
        <span id="highlight-indicator" class="color-indicator highlight-indicator"></span>
        <span class="dropdown-arrow">▾</span>
    </button>

    <input
        type="color"
        id="highlight-color"
        value="#ffff00"
        class="hidden-color-input"
        aria-label="Choose highlight colour"
    >
</div>



        <button data-command="justifyLeft" title="Align left"><i class="fa-solid fa-align-left"></i></button>
        <button data-command="justifyCenter" title="Center">☰</button>
        <button data-command="justifyRight" title="Align right"><i class="fa-solid fa-align-right"></i></button>

    </nav>
<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <button id="new-document-btn" class="new-doc-btn">
            + New document
        </button>

        <h3>My Documents</h3>

        <div id="document-list"></div>
    </aside>

    <!-- Main Area -->
    <main class="Pages">
        <div class="document-page">
            <div id="editor" contenteditable="true">
</div>
        </div>
    </main>

</div>

    <!-- Bottom Bar -->
    <footer class="statusbar">
        <span id="word-count" style="background-color:#E8F0FE;color: #1A3C70; font-size: 16px;">Words: 0</span>
        <span>Editing mode</span>
    </footer>

    </div>
    <dialog id="share-dialog"><form id="share-form">
        <h2>Share document</h2><p>Only people you add can access this document.</p>
        <label>Email <input id="share-email" type="email" required maxlength="254"></label>
        <label>Access <select id="share-role"><option value="viewer">Viewer</option><option value="editor">Editor</option></select></label>
        <button type="submit">Save access</button>
        <p id="share-message" role="status"></p><div id="permission-list"></div>
        <button id="copy-link" type="button">Copy document link</button>
        <button id="close-sharing" type="button">Done</button>
    </form></dialog>
    <script src="auth.js"></script>
    <script src="script.js"></script>

</body>
</html>
